<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-3">
                <h1 class="text-center">Calculator</h1>
                <form id="calculator-form">
                    <div class="mb-3">
                        <label for="num1" class="form-label">Number 1</label>
                        <input type="number" id="num1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="num2" class="form-label">Number 2</label>
                        <input type="number" id="num2" class="form-control" required>
                    </div>
                    <div class="mb-3 text-center">
                        <button type="button" class="btn btn-primary" onclick="performCalculation('add')">Add</button>
                        <button type="button" class="btn btn-secondary" onclick="performCalculation('subtract')">Subtract</button>
                        <button type="button" class="btn btn-success" onclick="performCalculation('multiply')">Multiply</button>
                        <button type="button" class="btn btn-danger" onclick="performCalculation('divide')">Divide</button>
                    </div>
                </form>
                <div id="result" class="alert alert-info text-center" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>
<script>
    async function performCalculation(operation) {
        const num1 = document.getElementById('num1').value;
        const num2 = document.getElementById('num2').value;

        if (!num1 || !num2) {
            alert("Please fill in both numbers.");
            return;
        }

        try {
            const response = await fetch(`http://localhost:5000/${operation}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ num1: parseFloat(num1), num2: parseFloat(num2) }),
            });

            const result = await response.json();
            const resultDiv = document.getElementById('result');
            if (result.error) {
                resultDiv.classList.add('alert-danger');
                resultDiv.classList.remove('alert-info');
                resultDiv.innerText = result.error;
            } else {
                resultDiv.classList.remove('alert-danger');
                resultDiv.classList.add('alert-info');
                resultDiv.innerText = `Result: ${result.result}`;
            }
            resultDiv.style.display = 'block';
        } catch (error) {
            alert("Error connecting to the backend service.");
        }
    }
</script>
</body>
</html>
